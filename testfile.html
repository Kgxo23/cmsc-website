<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMSC - Cizrein Marine Services Co. | Welcome</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    background: url('images/bg.jpg') center/cover no-repeat fixed;
    position: relative;
    height: 100vh;
    overflow: hidden;
}

/* Gradient overlay from bottom to top - sky blue tint */
body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(145deg, 
        rgba(25, 118, 210, 0.65) 0%, 
        rgba(30, 144, 255, 0.45) 40%,
        rgba(100, 181, 246, 0.25) 70%,
        rgba(135, 206, 235, 0.1) 100%);
    pointer-events: none;
    z-index: 0;
}

/* All content goes above the overlay */
.navbar, .hero, .footer {
    position: relative;
    z-index: 1;
}

/* NAVBAR - Minimal sky blue */
.navbar {
    position: fixed;
    width: 100%;
    background: rgba(30, 136, 229, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 60px;
    z-index: 1000;
    top: 0;
    box-sizing: border-box;
}

/* LOGO - Larger size */
.logo img {
    height: 55px;
    transition: transform 0.2s ease;
}

.logo img:hover {
    transform: scale(1.02);
}

/* NAV LINKS - With underline hover effect */
.navbar nav a {
    color: white;
    margin-left: 35px;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s ease;
    font-size: 0.95rem;
    letter-spacing: -0.2px;
    opacity: 0.9;
    padding-bottom: 5px;
    border-bottom: 2px solid transparent;
}

.navbar nav a:hover {
    opacity: 1;
    border-bottom-color: white;
}

/* HERO SECTION - Perfectly centered */
.hero {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero-content {
    text-align: center;
}

.hero-content img {
    width: 320px;
    display: block;
    margin: 0 auto;
}

.hero-content p {
    font-size: 1.2rem;
    color: rgb(78, 102, 125);
    margin-top: 20px;
    letter-spacing: -0.2px;
    font-weight: 400;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    opacity: 0.95;
}

/* FOOTER - Minimal */
.footer {
    background: rgba(13, 71, 161, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: rgba(255, 255, 255, 0.7);
    text-align: center;
    padding: 14px;
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    font-size: 0.8rem;
    z-index: 100;
    font-weight: 400;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .navbar {
        padding: 12px 25px;
        flex-direction: column;
        gap: 8px;
    }
    
    .logo img {
        height: 45px;
    }
    
    .navbar nav a {
        margin-left: 20px;
        margin-right: 20px;
        font-size: 0.85rem;
    }
    
    .hero-content img {
        width: 220px;
    }
    
    .hero-content p {
        font-size: 1rem;
        margin-top: 16px;
    }
}

@media (max-width: 480px) {
    .navbar {
        padding: 10px 15px;
    }
    
    .logo img {
        height: 38px;
    }
    
    .navbar nav a {
        margin-left: 12px;
        margin-right: 12px;
        font-size: 0.8rem;
    }
    
    .hero-content img {
        width: 180px;
    }
    
    .hero-content p {
        font-size: 0.9rem;
        margin-top: 12px;
    }
}
</style>
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
    <div class="logo">
        <img src="images/ship-logo.png" alt="CMSC Logo">
    </div>
    <nav>
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="services.html">SERVICES</a>
        <a href="contact.html">CONTACT</a>
    </nav>
</header>

<!-- HERO SECTION - Perfectly centered logo and tagline -->
<section class="hero">
    <div class="hero-content">
        <img src="images/full-logo.png" alt="CMSC Full Logo">
        <p>Your Trusted Partner in Marine Excellence</p>
    </div>
</section>

<!-- FOOTER -->
<footer class="footer">
    <p>&copy; 2025 Cizrein Marine Services Co. (CMSC). All rights reserved.</p>
</footer>

</body>
</html>
